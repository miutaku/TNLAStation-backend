name: 機能提案
description: 新機能や改善を提案します
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 実装案ではなく、困っている状況を記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 希望する動作、EPGStationとの互換性、代替案など
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考資料
