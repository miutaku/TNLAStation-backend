name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Validate version tag
        env:
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use SemVer, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Lint Dockerfile.ffmpeg-worker
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.ffmpeg-worker
          ignore: DL3008

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend tags
        id: backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miutaku/tnlastation-backend
          flavor: suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Generate ffmpeg-worker tags
        id: ffmpeg-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miutaku/tnlastation-ffmpeg-worker
          flavor: suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Publish backend architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.backend.outputs.version }}
          push: true
          tags: ${{ steps.backend.outputs.tags }}
          labels: ${{ steps.backend.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

      - name: Publish ffmpeg-worker architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg-worker
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.ffmpeg-worker.outputs.tags }}
          labels: ${{ steps.ffmpeg-worker.outputs.labels }}
          cache-from: type=gha,scope=ffmpeg-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ffmpeg-worker-${{ matrix.arch }}

  publish:
    name: Publish multi-architecture manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-tooling
          sparse-checkout: scripts/generate-release-notes.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate backend tags
        id: backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miutaku/tnlastation-backend
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
      - name: Generate ffmpeg-worker tags
        id: ffmpeg-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miutaku/tnlastation-ffmpeg-worker
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
      - name: Publish manifests
        env:
          BACKEND_TAGS: ${{ steps.backend.outputs.tags }}
          WORKER_TAGS: ${{ steps.ffmpeg-worker.outputs.tags }}
        run: |
          for variable in BACKEND_TAGS WORKER_TAGS; do
            while IFS= read -r image; do
              docker buildx imagetools create \
                --tag "$image" \
                "$image-amd64" \
                "$image-arm64"
            done <<< "${!variable}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .release-tooling/scripts/generate-release-notes.sh "$RELEASE_TAG" release-notes.md

          release_args=(
            "$RELEASE_TAG"
            --verify-tag
            --title "$RELEASE_TAG"
            --notes-file release-notes.md
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
