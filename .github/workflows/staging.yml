name: Publish Staging Images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  publish:
    name: Publish verified main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set staging version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "value=staging-${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: |
            ghcr.io/miutaku/tnlastation-backend:staging
            ghcr.io/miutaku/tnlastation-backend:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish FFmpeg Worker staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg-worker
          push: true
          tags: |
            ghcr.io/miutaku/tnlastation-ffmpeg-worker:staging
            ghcr.io/miutaku/tnlastation-ffmpeg-worker:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
