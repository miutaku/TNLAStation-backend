name: Publish Staging Images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set staging version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "app=0.0.0-staging.${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=staging-${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend staging architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.app }}
          push: true
          tags: |
            ghcr.io/miutaku/tnlastation-backend:staging-${{ matrix.arch }}
            ghcr.io/miutaku/tnlastation-backend:${{ steps.version.outputs.image }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.app }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

      - name: Publish FFmpeg Worker staging architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg-worker
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/miutaku/tnlastation-ffmpeg-worker:staging-${{ matrix.arch }}
            ghcr.io/miutaku/tnlastation-ffmpeg-worker:${{ steps.version.outputs.image }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.app }}
          cache-from: type=gha,scope=ffmpeg-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ffmpeg-worker-${{ matrix.arch }}

  publish:
    name: Publish multi-architecture manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set staging version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image=staging-${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifests
        env:
          VERSION: ${{ steps.version.outputs.image }}
        run: |
          for image in tnlastation-backend tnlastation-ffmpeg-worker; do
            docker buildx imagetools create \
              --tag "ghcr.io/miutaku/$image:staging" \
              "ghcr.io/miutaku/$image:staging-amd64" \
              "ghcr.io/miutaku/$image:staging-arm64"
            docker buildx imagetools create \
              --tag "ghcr.io/miutaku/$image:$VERSION" \
              "ghcr.io/miutaku/$image:$VERSION-amd64" \
              "ghcr.io/miutaku/$image:$VERSION-arm64"
          done
